[project]
name = "catalyst"
version = "5.7.0"
description = "Catalyst — persistent personal AI collaborator, autonomous engineering/media orchestrator, and adaptive reasoning runtime"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "playwright>=1.50"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
[project.scripts]
catalyst = "catalyst.__main__:main"
catalyst-device-agent = "catalyst.device_agent:main"

[tool.setuptools.packages.find]
include = ["catalyst*"]
