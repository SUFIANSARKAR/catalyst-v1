<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalyst Desktop — Holographic Bridge</title><style>
:root{--bg:#020713;--panel:#06192e;--line:#1b5577;--text:#e9faff;--muted:#8db0c5;--cyan:#61e7ff;--blue:#168ed3;--green:#66e3ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#0b4d78 0,#03152a 45%,#020713 100%);color:var(--text);font:14px Inter,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:44px 32px}.shell:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#61e7ff22 1px,transparent 1px),linear-gradient(90deg,#61e7ff22 1px,transparent 1px);background-size:44px 44px}header{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);padding-bottom:24px;position:relative}h1{margin:0 0 7px;letter-spacing:.08em;font-size:30px}p{margin:0;color:var(--muted)}#badge{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--cyan);font-size:11px;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0;position:relative}label{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}input{width:100%;margin-top:8px;background:#031426;border:1px solid var(--line);color:white;border-radius:10px;padding:12px}button{border:1px solid #2a769b;background:#082c4a;color:white;padding:11px 16px;border-radius:10px;cursor:pointer}button:hover{border-color:var(--cyan);background:#0b4167}.row{display:flex;gap:10px;position:relative}pre{margin-top:24px;background:#031426;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:320px;white-space:pre-wrap;color:#a9e9f7;position:relative}@media(max-width:700px){.shell{padding:24px 18px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header><div><h1>◈ CATALYST DESKTOP</h1><p>Holographic companion · authenticated device bridge</p></div><span id="badge">OFFLINE</span></header><section class="grid"><label>API URL<input id="url" value="http://127.0.0.1:8000"></label><label>API token<input id="token" type="password" placeholder="optional for local server"></label><label>Device name<input id="name" value="Catalyst Desktop"></label></section><div class="row"><button id="connect">Connect</button><button id="disconnect">Disconnect</button><button id="sys">System info</button></div><pre id="log">Ready. Connect this companion to a running Catalyst control plane.</pre></main><script type="module" src="/src/main.js"></script></body></html>
